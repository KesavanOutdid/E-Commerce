openapi: 3.0.0
info:
  title: E-Commerce Multi-Vendor Platform API
  version: 1.0.0
  description: Complete API documentation for E-Commerce Multi-Vendor Platform with multi-role system and KYC approval workflow
  contact:
    name: API Support
    email: info@outdidunified.com

servers:
  - url: http://localhost:9000
    description: Local server
  - url: http://192.168.0.14:5000
    description: Network Access (LAN)
  - url: http://172.29.240.1:9000
    description: Network Access (WSL)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        roles:
          type: array
          items:
            type: integer
          description: Array of role IDs (1=Admin, 2=Seller, 3=Customer)
        roleNames:
          type: array
          items:
            type: string
        status:
          type: boolean
        createdAt:
          type: string
          format: date-time

    Seller:
      type: object
      properties:
        userId:
          type: string
        shopName:
          type: string
        gstin:
          type: string
        panNumber:
          type: string
        kycApproved:
          type: boolean
        kycApprovedBy:
          type: string
        kycApprovedAt:
          type: string
          format: date-time
        commissionPercentage:
          type: number
          minimum: 0
          maximum: 100
        bankDetails:
          type: object
          properties:
            accountNumber:
              type: string
            ifscCode:
              type: string
            bankName:
              type: string
            accountHolderName:
              type: string

    Role:
      type: object
      properties:
        roleId:
          type: integer
        roleName:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        modifiedBy:
          type: string
        modifiedAt:
          type: string
          format: date-time
        status:
          type: boolean

security:
  - bearerAuth: []

paths:
  # ============================================================
  # ADMIN ENDPOINTS
  # ============================================================

  /api/admin/login:
    post:
      tags:
        - Admin - Authentication
      summary: Admin login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identifier
                - password
              properties:
                identifier:
                  type: string
                  description: Email or phone number
                  example: admin@gmail.com
                password:
                  type: string
                  example: admin123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                      tokenType:
                        type: string
                      userId:
                        type: string
                      roles:
                        type: array
                        items:
                          type: integer
                      roleNames:
                        type: array
                        items:
                          type: string
                      email:
                        type: string
                      phone:
                        type: string
                      firstName:
                        type: string
                      lastName:
                        type: string

  /api/admin/forgot-password:
    post:
      tags:
        - Admin - Authentication
      summary: Request password reset OTP for admin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: OTP sent to email if it exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      otpRef:
                        type: string
                      expiresInSec:
                        type: integer
                      resendAvailableInSec:
                        type: integer

  /api/admin/validate-otp:
    post:
      tags:
        - Admin - Authentication
      summary: Validate OTP for password reset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - otp
                - otpRef
              properties:
                otp:
                  type: string
                otpRef:
                  type: string
      responses:
        '200':
          description: OTP validated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      resetToken:
                        type: string

  /api/admin/set-new-password:
    post:
      tags:
        - Admin - Authentication
      summary: Set new password using reset token
      security: []
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
          description: Bearer {resetToken}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - newPassword
                - confirmPassword
              properties:
                newPassword:
                  type: string
                confirmPassword:
                  type: string
      responses:
        '200':
          description: Password updated successfully

  /api/admin/profile:
    get:
      tags:
        - Admin - Profile
      summary: Get admin profile
      responses:
        '200':
          description: Profile retrieved successfully

    put:
      tags:
        - Admin - Profile
      summary: Update admin profile
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                phone:
                  type: string
      responses:
        '200':
          description: Profile updated successfully

  /api/admin/roles:
    get:
      tags:
        - Admin - Roles Management
      summary: Get all roles
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Roles retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Role'
                  pagination:
                    type: object
                    properties:
                      currentPage:
                        type: integer
                      pageSize:
                        type: integer
                      totalItems:
                        type: integer
                      totalPages:
                        type: integer

    post:
      tags:
        - Admin - Roles Management
      summary: Create new role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - roleName
              properties:
                roleName:
                  type: string
                  example: Moderator
      responses:
        '201':
          description: Role created successfully

  /api/admin/roles/{roleId}:
    put:
      tags:
        - Admin - Roles Management
      summary: Update role by ID
      parameters:
        - in: path
          name: roleId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - roleName
              properties:
                roleName:
                  type: string
      responses:
        '200':
          description: Role updated successfully

    delete:
      tags:
        - Admin - Roles Management
      summary: Delete role by ID (soft delete)
      parameters:
        - in: path
          name: roleId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Role deleted successfully

  /api/admin/users:
    get:
      tags:
        - Admin - User Management
      summary: Get all users with pagination and filters
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: role
          schema:
            type: integer
          description: Filter by role ID (1=Admin, 2=Seller, 3=Customer)
        - in: query
          name: status
          schema:
            type: boolean
          description: Filter by active/inactive status
      responses:
        '200':
          description: Users retrieved successfully

    post:
      tags:
        - Admin - User Management
      summary: Add new user (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - email
                - password
                - roles
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                phone:
                  type: string
                password:
                  type: string
                roles:
                  type: array
                  items:
                    type: integer
      responses:
        '201':
          description: User added successfully

  /api/admin/users/{userId}:
    put:
      tags:
        - Admin - User Management
      summary: Update user details
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                phone:
                  type: string
                roles:
                  type: array
                  items:
                    type: integer
                status:
                  type: boolean
      responses:
        '200':
          description: User updated successfully

  /api/admin/seller/{userId}/commission:
    put:
      tags:
        - Admin - Seller Management
      summary: Manage seller (approve KYC, approve go-live, reject, update commission)
      description: Unified endpoint for all seller management operations - approve KYC, approve go-live with commission, reject KYC, or update commission
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum: [approve, approve-golive, reject, update-commission]
                  description: Action to perform
                commissionPercentage:
                  type: number
                  minimum: 0
                  maximum: 100
                  description: Required when action=approve-golive or action=update-commission
                reason:
                  type: string
                  description: Optional reason when action=reject
            examples:
              approve:
                value:
                  action: approve
              approve-golive:
                value:
                  action: approve-golive
                  commissionPercentage: 10
              reject:
                value:
                  action: reject
                  reason: Invalid documents
              update-commission:
                value:
                  action: update-commission
                  commissionPercentage: 15
      responses:
        '200':
          description: Seller updated successfully

  # ============================================================
  # SELLER ENDPOINTS
  # ============================================================

  /api/seller/login:
    post:
      tags:
        - Seller - Authentication
      summary: Seller login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identifier
                - password
              properties:
                identifier:
                  type: string
                  description: Email or phone number
                password:
                  type: string
      responses:
        '200':
          description: Login successful

  /api/seller/register/send-otp:
    post:
      tags:
        - Seller - Authentication
      summary: Send OTP for seller registration
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: OTP sent successfully
        '429':
          description: Please wait before requesting another OTP

  /api/seller/register:
    post:
      tags:
        - Seller - Authentication
      summary: Register new seller
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - email
                - password
                - otpCode
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
                password:
                  type: string
                otpCode:
                  type: string
      responses:
        '201':
          description: Seller registered successfully

  /api/seller/google/config:
    get:
      tags:
        - Seller - Authentication
      summary: Get Google OAuth configuration
      security: []
      responses:
        '200':
          description: Google client ID retrieved

  /api/seller/google/login:
    post:
      tags:
        - Seller - Authentication
      summary: Seller Google login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - idToken
              properties:
                idToken:
                  type: string
                phone:
                  type: string
      responses:
        '200':
          description: Login successful
        '201':
          description: New seller account created and logged in

  /api/seller/forgot-password:
    post:
      tags:
        - Seller - Authentication
      summary: Request password reset OTP for seller
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: OTP sent to email if it exists

  /api/seller/validate-otp:
    post:
      tags:
        - Seller - Authentication
      summary: Validate OTP for password reset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - otp
                - otpRef
              properties:
                otp:
                  type: string
                otpRef:
                  type: string
      responses:
        '200':
          description: OTP validated successfully

  /api/seller/set-new-password:
    post:
      tags:
        - Seller - Authentication
      summary: Set new password using reset token
      security: []
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
          description: Bearer {resetToken}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - newPassword
                - confirmPassword
              properties:
                newPassword:
                  type: string
                confirmPassword:
                  type: string
      responses:
        '200':
          description: Password updated successfully

  /api/seller/profile:
    get:
      tags:
        - Seller - Profile
      summary: Get seller profile
      responses:
        '200':
          description: Profile retrieved successfully

    put:
      tags:
        - Seller - Profile
      summary: Update seller profile
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                phone:
                  type: string
      responses:
        '200':
          description: Profile updated successfully

  /api/seller/kyc/request:
    post:
      tags:
        - Seller - KYC
      summary: Submit KYC request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - shopName
                - gstin
                - panNumber
              properties:
                shopName:
                  type: string
                gstin:
                  type: string
                panNumber:
                  type: string
                bankDetails:
                  type: object
                  properties:
                    accountNumber:
                      type: string
                    ifscCode:
                      type: string
                    bankName:
                      type: string
                    accountHolderName:
                      type: string
      responses:
        '200':
          description: KYC request submitted successfully

  /api/seller/kyc/status:
    get:
      tags:
        - Seller - KYC
      summary: Get seller profile with KYC status
      responses:
        '200':
          description: Seller profile and KYC status retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      userId:
                        type: string
                      firstName:
                        type: string
                      lastName:
                        type: string
                      email:
                        type: string
                      phone:
                        type: string
                      shopName:
                        type: string
                      gstin:
                        type: string
                      panNumber:
                        type: string
                      bankDetails:
                        type: object
                        properties:
                          accountNumber:
                            type: string
                          ifscCode:
                            type: string
                          bankName:
                            type: string
                          accountHolderName:
                            type: string
                      kycApproved:
                        type: boolean
                      kycApprovedBy:
                        type: string
                      kycApprovedAt:
                        type: string
                        format: date-time
                      onboardingCompleted:
                        type: boolean
                      commissionPercentage:
                        type: number

  # ============================================================
  # USER (CUSTOMER) ENDPOINTS
  # ============================================================

  /api/user/login:
    post:
      tags:
        - User - Authentication
      summary: Customer login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identifier
                - password
              properties:
                identifier:
                  type: string
                  description: Email or phone number
                password:
                  type: string
      responses:
        '200':
          description: Login successful

  /api/user/register/send-otp:
    post:
      tags:
        - User - Authentication
      summary: Send OTP for user registration
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: OTP sent successfully
        '429':
          description: Please wait before requesting another OTP

  /api/user/register:
    post:
      tags:
        - User - Authentication
      summary: Register new customer
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - email
                - password
                - otpCode
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
                password:
                  type: string
                otpCode:
                  type: string
      responses:
        '201':
          description: User registered successfully

  /api/user/google/config:
    get:
      tags:
        - User - Authentication
      summary: Get Google OAuth configuration
      security: []
      responses:
        '200':
          description: Google client ID retrieved

  /api/user/google/login:
    post:
      tags:
        - User - Authentication
      summary: User Google login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - idToken
              properties:
                idToken:
                  type: string
                phone:
                  type: string
      responses:
        '200':
          description: Login successful
        '201':
          description: New user account created and logged in

  /api/user/forgot-password:
    post:
      tags:
        - User - Authentication
      summary: Request password reset OTP for user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: OTP sent to email if it exists

  /api/user/validate-otp:
    post:
      tags:
        - User - Authentication
      summary: Validate OTP for password reset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - otp
                - otpRef
              properties:
                otp:
                  type: string
                otpRef:
                  type: string
      responses:
        '200':
          description: OTP validated successfully

  /api/user/set-new-password:
    post:
      tags:
        - User - Authentication
      summary: Set new password using reset token
      security: []
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
          description: Bearer {resetToken}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - newPassword
                - confirmPassword
              properties:
                newPassword:
                  type: string
                confirmPassword:
                  type: string
      responses:
        '200':
          description: Password updated successfully

  /api/user/profile:
    get:
      tags:
        - User - Profile
      summary: Get user profile
      responses:
        '200':
          description: Profile retrieved successfully

    put:
      tags:
        - User - Profile
      summary: Update user profile
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                phone:
                  type: string
      responses:
        '200':
          description: Profile updated successfully

  /api/user/add-role:
    post:
      tags:
        - User - Profile
      summary: Add additional role to user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - roleId
              properties:
                roleId:
                  type: integer
                  description: Role ID to add (1=Admin, 2=Seller, 3=Customer)
                  example: 2
      responses:
        '200':
          description: Role added successfully with new token
