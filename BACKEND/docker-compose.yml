version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: backend-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_backend_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-backend-standalone
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-your-production-jwt-secret-key-must-be-strong}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-24h}
      - MONGODB_URI=${MONGODB_URI:-mongodb+srv://outdid:outdid@cluster0.t16a63a.mongodb.net/}
      - DB_NAME=${DB_NAME:-e-Commerce}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - EMAIL_USER=${EMAIL_USER:-info@outdidunified.com}
      - EMAIL_PASS=${EMAIL_PASS:-yylh zjwo psvr slqb}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_oHoZ3Q1fF6pYEI}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-Q9FQHLJGtA8knQPOmdTr7vpK}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - backend_standalone_uploads:/app/uploads
      - backend_standalone_logs:/app/logs

volumes:
  redis_backend_data:
  backend_standalone_uploads:
  backend_standalone_logs:
